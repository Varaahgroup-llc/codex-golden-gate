name: Bug report
description: Report a reproducible problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: "Never include keys, dotenv contents, private form captures, or unredacted logs. Report vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Plugin version and installation method
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Codex/chat host version, OS and Node version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps, expected result and actual result
    validations:
      required: true
