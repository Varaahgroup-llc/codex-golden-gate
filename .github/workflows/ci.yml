name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: plugins/golden-gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/golden-gate/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/select-test-browser.mjs
      - name: Validate change record, changelog and patch formatting
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/release_policy.py --base "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - name: Lint Actions expressions, job dependencies and shell steps
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        working-directory: .
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz -o actionlint.tar.gz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint"
      - name: Check JavaScript syntax
        run: for file in src/*.mjs scripts/*.mjs test/*.mjs; do node --check "$file"; done
      - name: Install pinned secret scanner
        working-directory: .
        run: bash scripts/install-ci-scanner.sh
      - name: Run checks and retain synthetic-data evidence
        working-directory: .
        run: python3 scripts/collect_test_evidence.py --output evidence
      - name: Screen synthetic evidence before upload
        id: evidence_scan
        if: always() && hashFiles('evidence/report.json') != ''
        working-directory: .
        run: bash scripts/scan_delivery.sh evidence
      - name: Retain evidence even on test failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.evidence_scan.outcome == 'success'
        with:
          name: evidence-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Scan and prepare release evidence
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]] || ! git diff --quiet "$BASE_SHA" HEAD -- docs/releases/bundle.json; then
            python3 scripts/candidate.py --output release --evidence evidence
          else
            python3 scripts/candidate.py --scan-only
            python3 scripts/package.py --output release
            python3 scripts/candidate.py --sbom-directory release
            (cd release && sha256sum sbom.cdx.json >> SHA256SUMS.txt)
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
          bash scripts/scan_delivery.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: golden-gate-packages-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
