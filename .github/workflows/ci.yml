name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: plugins/secret-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/secret-bridge/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/select-test-browser.mjs
      - run: npm run test:ui
      - working-directory: .
        run: python3 scripts/validate_release.py
      - working-directory: .
        run: python3 -m unittest discover -s tests -p test_submission_checks.py
      - working-directory: .
        run: python3 scripts/preflight_submission.py --report-only
      - working-directory: .
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: python3 scripts/package.py --output release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: secret-bridge-packages
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
