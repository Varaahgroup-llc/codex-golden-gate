name: Approved GitHub publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved annotated version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  inspect:
    if: github.repository == 'Varaahgroup-llc/codex-golden-gate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_distribution.py --tag "$RELEASE_TAG" --state draft
  publish:
    needs: inspect
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
      deployments: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck approval, publish the existing draft, and verify downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          python3 scripts/verify_distribution.py --tag "$RELEASE_TAG" --state draft
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          python3 scripts/verify_distribution.py --tag "$RELEASE_TAG" --state published
