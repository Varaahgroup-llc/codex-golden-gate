name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/secret-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/secret-bridge/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/select-test-browser.mjs
      - run: npm run test:ui
      - working-directory: .
        run: python3 -m unittest discover -s tests
      - working-directory: .
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate_release.py --tag "$RELEASE_TAG"
          python3 scripts/package.py --output release
      - name: Create reviewable draft
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt \
            --verify-tag --draft "${flags[@]}" \
            --title "Secret Bridge $RELEASE_TAG" \
            --generate-notes \
            --notes "See CHANGELOG.md and VALIDATION.md for compatibility limits. Native Codex modal behavior and live cloud saves require separate validation."
