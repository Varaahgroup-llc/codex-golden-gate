<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Gate</title>
<style>
:root{font:13px/1.45 system-ui,sans-serif;color-scheme:light dark;color:#20252b;background:transparent}*{box-sizing:border-box}body{margin:0;padding:8px}main{max-width:620px;margin:auto;padding:14px;border:1px solid #dce2e7;border-radius:12px;background:#fff}.brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:#53616d}.brand svg{width:15px;height:15px;color:#167461}.target{margin:9px 0 2px;overflow-wrap:anywhere;font-size:12px}.target strong{font-weight:600}.muted,#identity,#expiry{color:#64717d;font-size:11px}#identity{display:block;margin-bottom:10px;overflow-wrap:anywhere}.entry-row{display:flex;gap:7px;align-items:flex-start}.paste-slot{display:flex;align-items:center;flex:1;min-width:0;border:1px solid #b8c4cc;border-radius:8px;background:#f7f9fa}.paste-slot:focus-within{border-color:#167461;box-shadow:0 0 0 2px #16746120}.paste-slot input,.paste-slot textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:11px 12px;outline:none}.paste-slot textarea{min-height:82px;resize:vertical;font-family:ui-monospace,monospace}.paste-slot button{border:0;background:transparent;padding:10px;color:#64717d;font-size:11px}button{font:inherit;font-weight:600;padding:10px 13px;border:1px solid #c7d0d7;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button.primary{background:#167461;border-color:#167461;color:#fff}.cancel{font-size:11px;padding:0;border:0;color:#64717d}button:disabled{opacity:.45;cursor:default}.consent{font-size:11px;color:#64717d;margin:7px 0}.footer{display:flex;align-items:center;gap:12px}.options{font-size:11px;color:#64717d}.options summary{cursor:pointer;list-style:none}.options summary::-webkit-details-marker{display:none}.options[open]{flex:1}.check{display:flex;gap:6px;align-items:center;margin-top:7px}.check input{margin:0}#expiry{margin:6px 0 0}#status{font-size:11px;color:#64717d;margin-top:8px;white-space:pre-wrap}#status.error{color:#aa2735}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}button:focus-visible,summary:focus-visible{outline:2px solid #167461;outline-offset:3px}
@media(prefers-color-scheme:dark){:root{color:#edf1f4}main{background:#202429;border-color:#3c4249}.brand{color:#c3ccd3}.paste-slot{background:#191d21;border-color:#58616b}.muted,#identity,#expiry,.consent,#status,.options,.cancel,.paste-slot button{color:#a6b2bd}#status.error{color:#ffadb0}}
@media(max-width:380px){body{padding:4px}main{padding:11px}.entry-row{gap:5px}button.primary{padding:10px}.paste-slot button{padding:10px 7px}}
</style></head><body><main>
<div class="brand"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 8V5a3.5 3.5 0 0 1 7 0v3" stroke="currentColor" stroke-width="1.5"/></svg>Golden Gate <span class="muted">· key setup</span></div>
<div class="target"><span class="muted">Save to </span><strong id="destination">Waiting for the destination…</strong></div><span id="identity">—</span>
<form id="form" autocomplete="off"><fieldset id="fields" disabled style="padding:0;border:0;margin:0">
<div class="entry-row"><div class="paste-slot"><label class="sr-only" for="secret">Secret value</label><input id="secret" type="password" placeholder="Paste key here" autocomplete="new-password" spellcheck="false" autocapitalize="off" autocorrect="off" required aria-describedby="consent"><textarea id="multi" hidden autocomplete="off" spellcheck="false" aria-label="Multiline secret value" aria-describedby="consent"></textarea><button id="show" type="button" aria-label="Show value" aria-pressed="false">Show</button></div><button class="primary" id="save" type="submit">Save</button></div>
<p class="consent" id="consent">Save confirms this destination and replaces its existing value. The value stays out of chat.</p>
<div class="footer"><button class="cancel" id="cancel" type="button">Cancel</button><details class="options"><summary>Options</summary><label class="check"><input id="multiline" type="checkbox">Multiline value (visible text)</label><p id="expiry"></p></details></div>
</fieldset></form><div id="status" role="status" aria-live="polite">Connecting to the chat host…</div>
</main>
<script type="module">
const $=id=>document.getElementById(id);
let session, busy=false, finished=false, rpcId=0, ready=false;
const pending=new Map();
const notify=(method,params)=>parent.postMessage({jsonrpc:'2.0',method,params},'*');
let lastSize='';
const reportSize=()=>{if(!ready)return;const width=document.documentElement.clientWidth,height=Math.ceil(document.body.getBoundingClientRect().height),size=width+':'+height;if(size!==lastSize){lastSize=size;notify('ui/notifications/size-changed',{width,height});}};
new ResizeObserver(reportSize).observe(document.body);
const rpc=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Host request timed out.'));},90000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});
const message=(text,error=false)=>{$('status').textContent=text;$('status').className=error?'error':'';};
function clear(){ $('secret').value='';$('multi').value=''; }
function apply(result){
  const privateData=result?._meta?.goldenGate;
  if(privateData && !session){session=privateData;$('destination').textContent=session.label;$('identity').textContent=session.identity;$('expiry').textContent='Expires '+new Date(session.expiresAt).toLocaleTimeString();$('fields').disabled=!ready;message(ready?'Ready for private entry.':'Connecting to the chat host…');}
  const state=result?.structuredContent?.status;
  if(state && !['pending','saving'].includes(state)){finished=true;clear();$('fields').disabled=true;session=undefined;message(state==='saved'?'Saved. The chat receives a receipt without the value.':(result.structuredContent.message||'Entry '+state+'.'),state==='uncertain'||state==='failed');}
}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined){const p=pending.get(m.id);if(!p)return;clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error('The chat host rejected the request.')):p.resolve(m.result);}else if(m.method==='ui/notifications/tool-result')apply(m.params);});
// Legacy extension fallback supplies the same widget-only metadata, never widgetState.
function legacy(){const meta=window.openai?.toolResponseMetadata;apply(meta?.mcp_tool_result||meta?.call_tool_result||meta);}
window.addEventListener('openai:set_globals',legacy);
const b64=bytes=>{let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
async function encrypt(secret){
  const encoder=new TextEncoder(), encoded=encoder.encode(secret);
  if(!encoded.length||encoded.length>65536||/[\0\r]/.test(secret))throw new Error('Enter 1–65,536 UTF-8 bytes without NUL or carriage returns.');
  const publicKey=await crypto.subtle.importKey('jwk',session.publicKey,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)),iv=crypto.getRandomValues(new Uint8Array(12));
  const data=encoder.encode(JSON.stringify({secret,token:session.token,confirmed:true}));
  try{return{requestId:session.requestId,wrappedKey:b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},publicKey,raw)),iv:b64(iv),ciphertext:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:encoder.encode(session.requestId)},key,data))};}
  finally{raw.fill(0);data.fill(0);encoded.fill(0);}
}
async function callTool(name,args){const r=await rpc('tools/call',{name,arguments:args});if(r?.isError)throw new Error('The server rejected this entry. Ask for a new request.');apply(r);return r;}
$('show').onclick=()=>{const show=$('secret').type==='password';$('secret').type=show?'text':'password';$('show').textContent=show?'Hide':'Show';$('show').setAttribute('aria-label',show?'Hide value':'Show value');$('show').setAttribute('aria-pressed',String(show));};
$('multiline').onchange=()=>{const yes=$('multiline').checked;if(!yes&&$('multi').value.includes('\n')){$('multiline').checked=true;message('Keep multiline enabled to preserve line breaks.');return;}$('multi').hidden=!yes;$('secret').hidden=yes;$('show').hidden=yes;$('secret').required=!yes;$('multi').required=yes;if(yes){$('multi').value=$('secret').value;$('secret').value='';}else{$('secret').value=$('multi').value;$('multi').value='';$('secret').type='password';$('show').textContent='Show';$('show').setAttribute('aria-label','Show value');$('show').setAttribute('aria-pressed','false');}};
// Clicking Save (or submitting this labeled row from the keyboard) is explicit
// consent to the immutable destination above. Pasting never submits a value.
$('form').onsubmit=async event=>{event.preventDefault();if(busy||finished||!session)return;busy=true;$('fields').disabled=true;message('Encrypting and saving…');let submitted=false;try{const payload=await encrypt($('multiline').checked?$('multi').value:$('secret').value);clear();submitted=true;await callTool('submit_secret',payload);}catch(err){message(submitted?'Save status is unknown. Ask the assistant to check the receipt before attempting another write.':err.message,true);if(submitted){finished=true;session=undefined;}}finally{busy=false;$('fields').disabled=finished||!session;}};
$('cancel').onclick=async()=>{if(!session||busy||finished)return;busy=true;$('fields').disabled=true;clear();try{await callTool('cancel_secret_entry',{requestId:session.requestId,token:session.token});}catch{message('Cancellation was not acknowledged. This entry will expire.',true);finished=true;session=undefined;}finally{busy=false;}};
setInterval(()=>{if(session&&!busy&&Date.now()>=session.expiresAt){clear();session=undefined;finished=true;$('fields').disabled=true;message('This entry expired. Ask for a new request.');}},1000);
window.addEventListener('pagehide',clear);
if(parent===window){message('Ask Golden Gate to show this paste slot in a compatible chat host.',true);}
else if(!crypto.subtle){message('This host does not provide the required Web Crypto API. Entry is disabled.',true);}
else{try{await rpc('ui/initialize',{appInfo:{name:'golden-gate',version:'__GOLDEN_GATE_VERSION__'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'});ready=true;notify('ui/notifications/initialized',{});legacy();if(session)$('fields').disabled=false;message(session?'Ready for private entry.':'Waiting for the destination…');reportSize();}catch{message('This chat host did not initialize MCP Apps. Entry is disabled.',true);}}
</script></body></html>
